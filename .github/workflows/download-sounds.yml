# Downloads the nature recordings from Freesound and saves them in sounds/,
# so the web version (iPad) can play them. Run it from the Actions tab:
#   Actions → "Download sounds" → Run workflow.
# Needs a repository secret named FREESOUND_KEY (Settings → Secrets and
# variables → Actions → New repository secret).
name: Download sounds

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Choose all recordings again (instead of only filling gaps)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and check recordings
        timeout-minutes: 45
        env:
          QP_DEADLINE_MIN: "35"   # stop starting new scenes after 35 min; run again to finish
          FREESOUND_KEY: ${{ secrets.FREESOUND_KEY }}
        run: |
          if [ -z "$FREESOUND_KEY" ]; then
            echo "::error::Add a repository secret named FREESOUND_KEY first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python3 -u fetch_sounds.py ${{ inputs.refresh && '--refresh' || '' }}
          cat sounds/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      # Runs even if the download stopped part-way, so finished scenes are kept;
      # running the workflow again then only fills in what is missing.
      - name: Save the recordings in the repository
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          find sounds -name '*.part' -delete
          git add sounds
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Download nature recordings from Freesound"
          git pull --rebase --autostash origin main
          git push
